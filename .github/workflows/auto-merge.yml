name: Auto-merge tool PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    steps:
      - name: Wait for checks to pass
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            // Relevant checks (test.yml et al.) are triggered by a separate
            // `pull_request` event and can take a few seconds to register a
            // check run. Don't treat "none seen yet" as "nothing to wait
            // for" until we've given them a grace period to show up --
            // otherwise this job (triggered by `pull_request_target`, which
            // fires in parallel) can race ahead and merge before the other
            // workflow has even started.
            const GRACE_ITERATIONS = 6; // 6 * 10s = 60s
            for (let i = 0; i < 30; i++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: sha,
              });
              const runs = data.check_runs.filter(r => r.name !== 'auto-merge');
              const relevant = runs.filter(r => /deploy|build|test/i.test(r.name));
              if (relevant.length === 0) {
                if (i < GRACE_ITERATIONS) {
                  await new Promise(r => setTimeout(r, 10000));
                  continue;
                }
                return;
              }
              const allDone = relevant.every(r => r.status === 'completed');
              const anyFail = relevant.some(r => ['failure','cancelled','timed_out'].includes(r.conclusion));
              if (anyFail) { core.setFailed('A required check failed; not merging.'); return; }
              if (allDone) return;
              await new Promise(r => setTimeout(r, 10000));
            }
            core.setFailed('Timed out waiting for checks.');
      - name: Merge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, merge_method: 'squash',
            });
