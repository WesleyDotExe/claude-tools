name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run each tool's test suite
        run: |
          set -e
          shopt -s nullglob
          ran=0
          for dir in tools/*/; do
            name=$(basename "$dir")
            if [ -d "${dir}tests" ]; then
              echo "::group::$name"
              (cd "$dir" && python3 -m unittest discover -s tests -v)
              ran=$((ran + 1))
              echo "::endgroup::"
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "No tools/*/tests directories found." >&2
            exit 1
          fi
          echo "Ran test suites for $ran tool(s)."
      - name: Sanity-check the collection index
        run: python3 tools/collection-index/index.py
